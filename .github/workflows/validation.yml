name: validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q powermodeling
  cuda-build:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git cmake g++
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_CUDA_ARCHITECTURES='70;80;90'
      - run: cmake --build build -j2
