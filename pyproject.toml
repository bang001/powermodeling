[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nvidia-powermodeling"
version = "0.1.0"
description = "Sustained CUDA throughput and capability-aware NVIDIA energy experiments"
requires-python = ">=3.10"
dependencies = ["nvidia-ml-py>=12.535", "numpy>=1.24"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]

[project.scripts]
powermodeling = "powermodeling.cli:main"

[tool.setuptools.packages.find]
include = ["powermodeling*"]
